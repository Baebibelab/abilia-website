<!doctype html>
<!-- Page de maintenance, autonome (pas de build Astro, aucune ressource externe) : voir .htaccess. -->
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <meta name="color-scheme" content="light dark" />
    <title>Site en maintenance · Under maintenance</title>
    <style>
      :root {
        --bg: #f7f5fb;
        --fg: #17141f;
        --muted: #5d586b;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #0d0b12;
          --fg: #f4f2f8;
          --muted: #a9a3b8;
        }
      }
      * { margin: 0; box-sizing: border-box; }
      body {
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px 16px;
        background: var(--bg);
        color: var(--fg);
        font: 17px/1.5 -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
        text-align: center;
      }
      main { display: grid; gap: 32px; max-width: 32rem; }
      h1 { font-size: clamp(1.6rem, 6vw, 2.2rem); line-height: 1.15; }
      p { color: var(--muted); margin-top: 8px; }
    </style>
  </head>
  <body>
    <main>
      <section>
        <h1>Le site fait peau neuve</h1>
        <p>Il revient très bientôt. Merci de votre patience&nbsp;!</p>
      </section>
      <section lang="en">
        <h1>We’re giving the site a makeover</h1>
        <p>It’ll be back very soon. Thanks for your patience!</p>
      </section>
    </main>
  </body>
</html>
