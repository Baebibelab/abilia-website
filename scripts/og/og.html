<!doctype html>
<!--
  Image de partage (Open Graph, 1200 × 630) des deux langues : public/og/andia-<langue>.png.
  Régénérer après un changement de titre ou de capture : node scripts/og/render.mjs
  (Playwright et Chromium sont nécessaires sur la machine, pas dans le projet).
-->
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      * { box-sizing: border-box; margin: 0; }
      html, body { width: 1200px; height: 630px; overflow: hidden; }
      body {
        position: relative;
        background: #07080b;
        color: #f5f6f7;
        font-family: 'Inter', -apple-system, 'SF Pro Display', sans-serif;
      }
      .halo { position: absolute; border-radius: 50%; filter: blur(70px); }
      .h1 { width: 620px; height: 620px; left: -160px; top: -260px; background: rgb(109 194 184 / 0.45); }
      .h2 { width: 560px; height: 560px; left: 300px; top: 280px; background: rgb(94 92 230 / 0.45); }
      .h3 { width: 520px; height: 520px; right: -60px; top: -120px; background: rgb(191 90 242 / 0.35); }
      .h4 { width: 420px; height: 520px; right: 120px; top: 120px; background: rgb(220 60 70 / 0.5); }
      .text { position: absolute; left: 80px; top: 92px; width: 640px; }
      .brand { display: flex; align-items: center; gap: 18px; }
      .brand svg { width: 76px; height: 76px; border-radius: 17px; box-shadow: 0 16px 40px -12px rgb(255 107 74 / 0.6); }
      .name { font-size: 34px; font-weight: 800; letter-spacing: -0.02em; }
      .eyebrow { margin-top: 2px; color: #ff8a6e; font-size: 15px; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase; }
      h1 { margin-top: 44px; font-size: 76px; font-weight: 800; line-height: 1.02; letter-spacing: -0.045em; }
      h1 span {
        display: block; padding-bottom: 0.08em;
        background: linear-gradient(100deg, #ff6b4a, #bf5af2 55%, #6dc2b8);
        -webkit-background-clip: text; background-clip: text; color: transparent;
      }
      .platforms { margin-top: 30px; color: rgb(235 235 245 / 0.72); font-size: 24px; font-weight: 500; }
      .phone {
        position: absolute; right: 120px; top: 70px; width: 300px; height: 650px;
        padding: 11px; border-radius: 54px; background: #111216;
        box-shadow: inset 0 0 0 2px rgb(255 255 255 / 0.18), 0 0 0 1px #000, 0 60px 120px -30px rgb(80 10 20 / 0.8);
        transform: rotate(6deg);
      }
      .phone img { display: block; width: 100%; height: 100%; object-fit: cover; object-position: top; border-radius: 44px; }
      .island { position: absolute; left: 50%; top: 22px; width: 92px; height: 27px; margin-left: -46px; border-radius: 20px; background: #000; }
    </style>
  </head>
  <body>
    <div class="halo h1"></div><div class="halo h2"></div><div class="halo h3"></div><div class="halo h4"></div>
    <div class="text">
      <div class="brand">
        <svg viewBox="0 0 96 96">
          <rect width="96" height="96" fill="#FF6B4A" />
          <path d="M24 76 L48 20 L72 76" fill="none" stroke="#fff" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" />
          <rect x="47" y="42" width="3.2" height="24" fill="#fff" />
          <path d="M50.2 42 C50.512 47.5 52.852 49.5 54.178 52 C55.426 54.2 55.192 57.2 54.1 59.2 C54.412 55.6 52.774 53.6 50.2 52.6 Z" fill="#fff" />
          <ellipse cx="44.8" cy="66.3" rx="5.6" ry="4.3" transform="rotate(-20 44.8 66.3)" fill="#fff" />
        </svg>
        <div>
          <div class="name">Andia</div>
          <div class="eyebrow" data-t="eyebrow"></div>
        </div>
      </div>
      <h1><span data-t="title1" style="background:none;color:inherit;display:block"></span><span data-t="title2"></span></h1>
      <p class="platforms" data-t="platforms"></p>
    </div>
    <div class="phone"><img src="../../src/assets/screenshots/en-lecture.jpg" alt="" /><span class="island"></span></div>
    <script>
      const texts = {
        fr: { eyebrow: 'Lecteur de musique pour Jellyfin', title1: 'Toute votre musique,', title2: 'dans votre poche.', platforms: 'Pour iPhone et Apple Watch' },
        en: { eyebrow: 'Music player for Jellyfin', title1: 'All your music,', title2: 'in your pocket.', platforms: 'For iPhone and Apple Watch' },
      };
      const lang = new URLSearchParams(location.search).get('lang') ?? 'fr';
      document.documentElement.lang = lang;
      for (const el of document.querySelectorAll('[data-t]')) el.textContent = texts[lang][el.dataset.t];
    </script>
  </body>
</html>
